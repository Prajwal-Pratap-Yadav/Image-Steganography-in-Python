repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Python format
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
        exclude: ^legacy/
      - id: ruff-check
        name: Python lint
        entry: .venv/bin/ruff check
        language: system
        types: [python]
        exclude: ^legacy/
      - id: gitleaks
        name: Staged credential scan
        entry: .tools/gitleaks protect --staged --redact
        language: system
        pass_filenames: false
        always_run: true
