[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stegolab"
version = "0.1.2"
description = "Lossless PNG payload experiments with measured distortion and explicit limits"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Prajwal Pratap Yadav", email = "prajwalpratapyadav5@gmail.com"}]
dependencies = ["numpy==2.3.3", "Pillow==12.3.0", "cryptography==50.0.2", "scipy==1.16.2", "scikit-image==0.26.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "hypothesis==6.168.3", "ruff==0.13.2", "mypy==1.18.2", "pre-commit==4.6.2", "build==1.6.1", "setuptools==80.9.0", "wheel==0.45.1", "pip-audit==2.9.0", "pip==26.2.1", "bandit==1.8.6", "matplotlib==3.10.6"]

[project.scripts]
stegolab = "stegolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy", "build", "dist", ".venv", ".wheelcheck"]
[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/stegolab"]
[[tool.mypy.overrides]]
module = ["scipy.*", "skimage.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["stegolab"]
branch = true
relative_files = true
patch = ["subprocess"]
[tool.coverage.report]
show_missing = true
